name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version must not already exist as tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/${TAG}")
          if [ "$HTTP" = "200" ]; then
            echo "::error::Version $VERSION in package.json already exists as tag $TAG. Bump the version before merging."
            exit 1
          fi
      - name: package-lock version must match package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$PKG_VERSION" != "$LOCK_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match package-lock.json version ($LOCK_VERSION). Run npm install and commit the lockfile."
            exit 1
          fi

  build:
    name: Lint, test, typecheck
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
